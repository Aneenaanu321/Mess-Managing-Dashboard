# Free-tier backend blueprint for Render.com
# Docs: https://render.com/docs/blueprint-spec
#
# Free plan has no interactive Shell. Migrations run via preDeployCommand.
# Seed once from your laptop (see docs/12-hosting-vercel-free.md) OR use
# initialDeployHook on the first successful deploy.

services:
  - type: web
    name: rfidcore-api
    runtime: node
    plan: free
    rootDir: .
    # NODE_ENV=production skips devDependencies unless --include=dev.
    buildCommand: npm ci --include=dev && npm run prisma:generate -w apps/api && npm run build -w apps/api
    # Runs after build, before traffic switches — works without Shell.
    preDeployCommand: npm run prisma:deploy -w apps/api
    # First successful deploy only — creates demo users / sample data.
    initialDeployHook: npm run prisma:seed -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: S3_ENDPOINT
        value: ""
      - key: SMTP_FROM
        value: RFIDCore <notifications@rfidcore.local>
