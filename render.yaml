# Free-tier backend blueprint for Render.com
# Docs: https://render.com/docs/blueprint-spec
#
# Background workers are NOT available on Render Free.
#
# After first successful deploy, open Shell on rfidcore-api and run:
#   npm run prisma:deploy -w apps/api
#   npm run prisma:seed -w apps/api

services:
  - type: web
    name: rfidcore-api
    runtime: node
    plan: free
    rootDir: .
    # NODE_ENV=production is set for runtime, so default npm ci skips
    # devDependencies (prisma CLI + typescript). Force them in for the build.
    buildCommand: npm ci --include=dev && npm run prisma:generate -w apps/api && npm run build -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: S3_ENDPOINT
        value: ""
      - key: SMTP_FROM
        value: RFIDCore <notifications@rfidcore.local>
