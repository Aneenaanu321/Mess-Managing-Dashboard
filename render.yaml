# Free-tier backend blueprint for Render.com
# Docs: https://render.com/docs/blueprint-spec
#
# After connecting the GitHub repo in Render → New → Blueprint:
# 1. Create a Neon Postgres DB and paste DATABASE_URL into the API env
# 2. Create an Upstash Redis DB and paste REDIS_URL
# 3. Set CORS_ORIGIN to your Vercel URL (https://….vercel.app)
# 4. Generate JWT secrets: openssl rand -hex 32
# 5. After first deploy, run migrate + seed from Render shell:
#      cd apps/api && npx prisma migrate deploy && npx prisma db seed

services:
  - type: web
    name: rfidcore-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npx prisma generate -w apps/api && npm run build -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: S3_ENDPOINT
        value: ""
      - key: SMTP_FROM
        value: RFIDCore <notifications@rfidcore.local>

  - type: worker
    name: rfidcore-worker
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npx prisma generate -w apps/api && npm run build -w apps/worker
    startCommand: npm run start -w apps/worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SMTP_FROM
        value: RFIDCore <notifications@rfidcore.local>
