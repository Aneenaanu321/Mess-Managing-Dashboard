version: "3.9"

# Production overlay: no bind-mounted source, no dev ports beyond what a reverse
# proxy needs, restart policies tightened, resource limits set. Postgres/Redis
# data should live on managed/persistent volumes appropriate to your host —
# the named volumes below are a starting point, not a backup strategy (see
# docs/10-deployment-hardening.md).
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# TLS termination is expected to sit in front of this (nginx/Caddy/your platform's
# load balancer) — nothing here binds directly to 80/443.

services:
  postgres:
    restart: always
    ports: [] # don't expose Postgres to the host in prod; only `api`/`worker` reach it over the compose network
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    restart: always
    ports: []
    deploy:
      resources:
        limits:
          memory: 256m

  minio:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m

  api:
    restart: always
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    restart: always
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 512m

  web:
    restart: always
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 512m
