<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create account | Mess Manager</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">
  <main class="auth-card" aria-label="Create account">
    <button type="button" class="auth-theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M21 14.5A8.5 8.5 0 1110.5 3 7 7 0 0021 14.5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
    </button>

    <header class="auth-header">
      <div class="auth-brand">
        <div class="auth-brand-mark" aria-hidden="true">MM</div>
        <div class="auth-brand-text">
          <div class="auth-brand-title">Mess Manager</div>
          <div class="auth-brand-sub">Admin Dashboard</div>
        </div>
      </div>
      <h1 class="auth-title">Create account</h1>
      <p class="auth-sub">Join Mess Manager to manage operations.</p>
    </header>

    <p class="auth-error" id="authError" role="alert"></p>

    <form class="auth-form" id="signupForm" novalidate>
      <div class="auth-field">
        <label class="auth-label" for="username">Username</label>
        <input class="auth-input" id="username" name="username" type="email" autocomplete="username" placeholder="you@example.com" required />
      </div>

      <div class="auth-field">
        <label class="auth-label" for="role">Account role</label>
        <select class="auth-select" id="role" name="role" required>
          <option value="manager">Manager</option>
          <option value="admin">Admin</option>
        </select>
        <p class="auth-hint" id="roleHint">Manage staff, deliveries, and expenses</p>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="password">Password</label>
        <div class="auth-password-wrap">
          <input class="auth-input" id="password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" required />
          <button type="button" class="auth-show-btn" id="togglePassword">Show</button>
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="confirmPassword">Confirm password</label>
        <input class="auth-input" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat your password" required />
      </div>

      <button type="submit" class="auth-submit" id="submitBtn">Create account</button>
    </form>

    <p class="auth-switch">
      Already have an account?
      <a class="auth-link" href="login.html">Sign in</a>
    </p>

    <footer class="auth-footer">Mess Manager · Secure sign-up</footer>
  </main>

  <script src="js/auth.js"></script>
  <script>
    (function () {
      if (Auth.isLoggedIn()) {
        window.location.replace("index.html");
        return;
      }

      const THEME_KEY = "mm-auth-theme";
      const body = document.body;
      const errorEl = document.getElementById("authError");
      const roleSelect = document.getElementById("role");
      const roleHint = document.getElementById("roleHint");
      const passwordInput = document.getElementById("password");
      const togglePassword = document.getElementById("togglePassword");

      function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.add("show");
      }

      function clearError() {
        errorEl.textContent = "";
        errorEl.classList.remove("show");
      }

      function applyTheme(dark) {
        body.classList.toggle("auth-dark", dark);
        try { localStorage.setItem(THEME_KEY, dark ? "dark" : "light"); } catch (_) {}
      }

      function syncRoleHint() {
        roleHint.textContent = Auth.roleMeta(roleSelect.value).hint;
      }

      try {
        applyTheme(localStorage.getItem(THEME_KEY) === "dark");
      } catch (_) {}

      document.getElementById("themeToggle").addEventListener("click", () => {
        applyTheme(!body.classList.contains("auth-dark"));
      });

      function syncRoleFromEmail() {
        const email = (document.getElementById("username").value || "").trim().toLowerCase();
        const seed = (Auth.SEED_USERS || []).find((u) => u.email === email);
        if (seed) {
          roleSelect.value = seed.role;
          roleSelect.disabled = true;
        } else {
          roleSelect.disabled = false;
        }
        syncRoleHint();
      }

      roleSelect.addEventListener("change", syncRoleHint);
      document.getElementById("username").addEventListener("input", syncRoleFromEmail);
      syncRoleHint();

      togglePassword.addEventListener("click", () => {
        const show = passwordInput.type === "password";
        passwordInput.type = show ? "text" : "password";
        togglePassword.textContent = show ? "Hide" : "Show";
      });

      document.getElementById("signupForm").addEventListener("submit", (e) => {
        e.preventDefault();
        clearError();
        const result = Auth.signup({
          username: document.getElementById("username").value,
          password: passwordInput.value,
          confirmPassword: document.getElementById("confirmPassword").value,
          role: roleSelect.value,
        });
        if (!result.ok) {
          showError(result.error);
          return;
        }
        window.location.href = "index.html";
      });
    })();
  </script>
</body>
</html>
