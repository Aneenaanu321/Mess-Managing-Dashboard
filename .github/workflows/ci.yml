name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://rfidcore:rfidcore@localhost:5432/rfidcore?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-only-access-secret-not-a-real-secret
  JWT_REFRESH_SECRET: ci-only-refresh-secret-not-a-real-secret
  NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
  CORS_ORIGIN: http://localhost:3000

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rfidcore
          POSTGRES_PASSWORD: rfidcore
          POSTGRES_DB: rfidcore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rfidcore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w apps/api

      - name: Run database migrations
        run: npm run prisma:deploy -w apps/api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
